# Reverse proxy. The data tier is not represented here on purpose: postgres,
# qdrant, and redis have no route from outside the private network.

upstream api { server api:8000; }
upstream web { server web:3000; }

server {
    listen 443 ssl http2;
    server_name rag.example.com;

    ssl_certificate     /etc/ssl/certs/rag.crt;
    ssl_certificate_key /etc/ssl/private/rag.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;

    # Login is the one endpoint worth rate limiting hard.
    location /auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api;
        include /etc/nginx/proxy_params;
    }

    # Belt and braces: the debug router is not even registered in production,
    # but blocking it at the edge means a misconfigured deploy still fails safe.
    location /api/debug/ { return 404; }

    location ~ ^/(auth|chat|documents|admin|health) {
        proxy_pass http://api;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://web;
        include /etc/nginx/proxy_params;
    }
}
