# Local development stack.
#
# Ports for postgres and qdrant are published here so you can inspect them with
# psql and the Qdrant dashboard. That is a development convenience: in any
# deployed environment the data tier has no published ports and lives on an
# internal network only. Keep that difference as two explicit compose files or
# profiles rather than a comment someone forgets to act on.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ragdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports: ["5432:5432"]          # dev only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage
    ports: ["6333:6333"]          # dev only
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build: ./backend
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://rag:${POSTGRES_PASSWORD}@postgres:5432/ragdb
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ISSUER: rag-api
      JWT_AUDIENCE: rag-web
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEBUG_TRACE: "true"         # must be false outside development
      CORS_ORIGINS: "http://localhost:3000,null"
    depends_on:
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.ingest"]
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:${POSTGRES_PASSWORD}@postgres:5432/ragdb
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  qdrantdata:
  redisdata:

# The dev console (assets/dev-console.html) is intentionally not served by any
# container. Open it from the filesystem, or serve it locally with
# `python -m http.server 5500`. If you open it as file:// the browser sends
# Origin: null, which is why that origin is in CORS_ORIGINS above — remove it
# if you serve the console over http instead.
